import dev.ithundxr.silk.ChangelogText

plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def generatedResources = file("src/generated/resources")
def existingResources = project.rootProject.file("common/src/main/resources")

sourceSets.main {
    resources {
        srcDir("src/generated/resources")
        exclude(".cache/**")
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs.configureEach {
        programArg "-mixin.config=create.mixins.json"
    }

    //    Runs only on NeoForge
    runs {
        data {
            data()
            programArgs "--all", "--mod", "blazinghot"
            programArgs "--output", generatedResources.absolutePath
            programArgs "--existing", existingResources.absolutePath
        }
    }
}

publishMods {
    String uncutChangelogText = ChangelogText.getChangelogText(rootProject).toString()
    String changelogText = uncutChangelogText.startsWith("Create:") ? uncutChangelogText.split(":", 3)[2] : uncutChangelogText.split(":", 2)[1]

    file = tasks.remapJar.archiveFile
    modLoaders.add("neoforge")
    changelog = changelogText
    displayName = "Create: Blazing Hot v${mod_version} for NeoForge ${minecraft_version}"
    type = release_type.equalsIgnoreCase("beta") ? BETA : release_type.equalsIgnoreCase("alpha") ? ALPHA : STABLE

    modrinth {
        minecraftVersions.add(minecraft_version)
        projectId = modrinth_id
        accessToken = System.getenv("MODRINTH_TOKEN")

        dryRun = !System.getenv("MODRINTH_RELEASE")?.toBoolean()

        requires("create")
    }

    curseforge {
        minecraftVersions.add(minecraft_version)
        projectId = curseforge_id
        accessToken = System.getenv("CURSEFORGE_TOKEN")

        dryRun = !System.getenv("CURSEFORGE_RELEASE")?.toBoolean()

        requires("create")
    }


    github {
        accessToken = System.getenv("GITHUB_TOKEN")
        parent project(":").tasks.named("publishGithub")
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    // mavens for Forge-exclusives
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.neoforged.net/releases/" } // NeoForge
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // Create and its dependencies
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_neoforge_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_neoforge_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_neoforge_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_neoforge_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neoforge_version}")

    // Development QOL
    switch (forge_recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "jei": modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }; break
//        case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"); break
//        case "emi": modLocalRuntime("dev.emi:emi-fabric:${emi_version}"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: ${forge_recipe_viewer}. Must be JEI or disabled.")
    }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-neoforge:0.5.0"))

    // if you would like to add integration with JEI, uncomment this line.
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")

    // Additional mods
    // Compat
    if (createaddition_neoforge == "true") modLocalRuntime("maven.modrinth:createaddition:${createaddition_neoforge_version}")
}

processResources {
    // set up properties for filling into metadata
    Map<String, String> properties = Map.of(
            "version", version as String,
            "neoforge_version", neoforge_version.split("\\.")[0], // only specify major version of neoforge
            "minecraft_version", minecraft_version,
            "create_version", create_neoforge_version.split("-")[0] // cut off build number
    )
    properties.forEach((k, v) -> inputs.property(k, v))

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
