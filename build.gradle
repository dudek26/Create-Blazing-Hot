import dev.ithundxr.silk.ChangelogText

plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id "io.github.p03w.machete" version "1.+" // automatic jar compressing on build
    id "dev.ithundxr.silk" version "0.11.16"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()

        runs.configureEach {
            vmArg("-XX:+AllowEnhancedClassRedefinition")
            vmArg("-XX:+IgnoreUnrecognizedVMOptions")
            vmArg("-Dmixin.debug.export=true")
            vmArg("-Dmixin.env.remapRefMap=true")
            vmArg("-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg")
        }
    }


    repositories {
        mavenCentral()
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
        maven { url = "https://maven.blamejared.com/" } // JEI
        maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
        maven { url = "https://maven.createmod.net" } // Create Forge, Ponder Forge, Flywheel
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        // layered mappings - Mojmap names, parchment
        mappings(loom.layered {
            it.officialMojangMappings { nameSyntheticMembers = false }
            it.parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
        })

        include(implementation("com.moulberry:mixinconstraints:${mixinconstraints_version}"))

        // see each subproject for dependencies.
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    group = rootProject.maven_group

    Boolean isRelease = System.getenv("RELEASE_BUILD")?.toBoolean() ?: false

    // Formats the mod version to include the loader and Minecraft version
    // example: 0.5+fabric-mc1.20.1
    String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
    version = "${mod_version}+${project.name}-mc${minecraft_version}" + (buildNumber != null && !isRelease ? "-build.${buildNumber}" : "")

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    java {
        withSourcesJar()
    }

    machete {
        // disable machete locally for faster builds
        enabled = buildNumber != null || isRelease
    }

}

tasks.register("datagen") {
    group = 'build'
    description = "Generate data on all platforms"
//    dependsOn(":fabric:runDatagen", ":neoforge:runData")
    dependsOn(":neoforge:runData")
}

String platform = System.getenv("PLATFORM")
tasks.register("blazinghotPublish") {
    if (platform == "both") {
        dependsOn(tasks.build, ":publishMods", ":fabric:publishMods", ":forge:publishMods")
    } else if (platform == "forge") {
        dependsOn(":neoforge:build", ":publishMods", ":neoforge:publishMods")
    } else throw new NullPointerException("Invalid platform: " + platform)
}

publishMods {
    String uncutChangelogText = ChangelogText.getChangelogText(rootProject).toString()
    String cutChangelogText = uncutChangelogText.startsWith("Create:") ? uncutChangelogText.split(":", 3)[2] : uncutChangelogText.split(":", 2)[1]
    String changelogText = cutChangelogText

    changelog = changelogText
    displayName = "Create: Blazing Hot v${mod_version} for mc${minecraft_version}"
    type = release_type.equalsIgnoreCase("alpha") ? ALPHA : release_type.equalsIgnoreCase("beta") ? BETA : STABLE

    github {
        accessToken = System.getenv("GITHUB_TOKEN")
        repository = "dudek26/Create-Blazing-Hot"
        commitish = System.getenv("BRANCH_NAME")
        tagName = "mc${minecraft_version}/v${mod_version}"

        dryRun = !System.getenv("GITHUB_RELEASE")?.toBoolean()

        // Allow the release to be initially created without any files.
        allowEmptyFiles = true
    }
}
